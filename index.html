<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wizz · Wizard score keeper</title>
    <meta name="description" content="Keep score for the Wizard card game with 3 to 10 players. Bids, tricks, scoreboard and chart. Works offline." />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e15" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wizz" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Apply a saved light/dark choice before first paint.
      try {
        var s = (JSON.parse(localStorage.getItem('wizz:v1') || '{}').settings || {}).theme;
        if (s === 'light' || s === 'dark') document.documentElement.dataset.theme = s;
      } catch (e) {}
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app" class="app"></div>
    <dialog id="dlg" aria-label="Dialog"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><p style="padding: 24px; text-align: center">Wizz needs JavaScript to keep score.</p></noscript>
  </body>
</html>
